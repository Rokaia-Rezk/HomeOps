<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeOps – منظومة صيانة المنازل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#14213d;--mut:#64708a;--bd:#dde3ef;--pr:#1d3a8a;--pr2:#e8eefc;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#18203a;--tx:#e8ecf7;--mut:#9aa6c4;--bd:#2a3556;--pr:#6c8cff;--pr2:#202c52;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1040px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:700;color:var(--pr);font-size:20px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:8px;color:var(--mut);text-decoration:none;cursor:pointer;font-size:14px}
nav a.on{background:var(--pr2);color:var(--pr);font-weight:600}
.wrap{max-width:1040px;margin:auto;padding:20px 16px 60px}
.auth{max-width:460px;margin:24px auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:600;width:100%;margin-top:16px}
html[data-theme="dark"] .btn{color:#0f1524}
.btn.sec{background:var(--pr2);color:var(--pr)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{width:auto;margin:0;padding:6px 14px}
.roles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.roles button{flex:1;min-width:76px;padding:9px 6px;border:1px solid var(--bd);background:var(--card);border-radius:10px;cursor:pointer;font-size:13px}
.roles button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border:1px solid var(--bd);border-radius:999px;background:var(--card);cursor:pointer;font-size:14px}
.chip.on{background:var(--pr2);border-color:var(--pr);color:var(--pr);font-weight:600}
.link{color:var(--pr);cursor:pointer;font-size:14px;text-decoration:underline;background:none;border:0;padding:0}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px}.ok{color:var(--ok)}
.rules{font-size:13px;color:var(--mut);margin:6px 0 0;padding:0;list-style:none}.rules li.y{color:var(--ok)}
.otp{display:flex;gap:10px;justify-content:center;direction:ltr}.otp input{width:56px;text-align:center;font-size:22px}
.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}
.steps{display:flex;gap:8px;margin-bottom:16px;font-size:13px}.steps div{flex:1;padding:8px;border-radius:10px;background:var(--card);border:1px solid var(--bd);text-align:center;color:var(--mut)}.steps .on{border-color:var(--pr);color:var(--pr);font-weight:700}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.b-urgent{background:#fde8e8;color:#b91c1c}.b-mid{background:#fff1d6;color:#b45309}.b-norm{background:#dcf5e3;color:#15803d}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.svc .card{margin:0;text-align:center;cursor:pointer}.svc .ic{font-size:34px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--bd)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:14px}.kv span:first-child{color:var(--mut)}
.tbl{overflow-x:auto}
@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
.shell{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}.side{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.side a{display:block;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--mut);font-size:14px;margin-bottom:3px}.side a.on{background:var(--pr2);color:var(--pr);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.stat small{color:var(--mut)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.bar2{height:8px;background:var(--pr2);border-radius:8px;overflow:hidden;margin:8px 0 4px}.bar2 i{display:block;height:100%;background:var(--pr)}
@media(max-width:760px){.shell{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="hd"></header>
<main class="wrap" id="app"></main>
<script>
var ROLES={customer:'عميل',tech:'فني',call:'كول سنتر',finance:'مالي',admin:'أدمن'};
var SERVICES=[['plumb','سباكة','🚰','تسريبات، سخانات، صرف'],['elec','كهرباء','💡','أعطال، شرر، تركيبات'],['paint','دهان','🎨','دهانات، رطوبة، تقشير']];
var PLACES=['المطبخ','الحمام','الصالة','غرفة نوم','البلكونة','مدخل / باب الشقة','خارج الشقة / السطح','غير ذلك'];
var SYMS=['مية بتنزل / تسريب','مفيش مية','ريحة غاز','ريحة حريق أو دخان','شرر أو صعقة كهربا','الكهربا قاطعة','صوت غريب','حاجة بايظة / مش شغالة','شروخ أو تلف في الحيطة/السقف','باب أو قفل مش بيفتح/بيقفل','تركيب أو تغيير أو صيانة دورية'];
var WHEN=['دلوقتي','النهاردة','من كام يوم','من أسابيع'];
var SLOTS=['الفترة الصباحية 09:00 – 12:00','بعد الظهر 12:00 – 16:00','الفترة المسائية 16:00 – 20:00'];
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var users=[],orders=[],sess=load('ho_sess',null),roleSel='customer';
var W={desc:'',place:'',syms:[],when:'',addr:0,date:'',slot:0,step:1};
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function go(h){location.hash=h}

/* ---- فرز مبدئي (قواعد بسيطة) – هيتبدل بنداء لموديل الـ ML (FastAPI) ---- */
function triageOld(){
  var t=(W.desc+' '+W.syms.join(' ')).toLowerCase(),svc='',pr='';
  if(/مية|ماسورة|تسريب|حوض|سخان|صرف|حمام/.test(t))svc='plumb';
  if(/كهرب|شرر|صعق|فيش|مفتاح|لمبة/.test(t))svc='elec';
  if(/دهان|بوية|رطوبة|تقشر|شروخ|حيط/.test(t))svc='paint';
  var urg=/غاز|حريق|دخان|شرر|صعق|بتنزل|قاطعة/.test(t);
  var mid=/مفيش|صوت|بايظة|مش شغال/.test(t);
  if(t.trim())pr=urg?'urgent':mid?'mid':'norm';
  return{svc:svc,pr:pr};
}
var PN={emerg:'طوارئ',urgent:'عاجل',mid:'متوسط',norm:'عادي'};
function pbadge(p){return '<span class="badge b-'+(p==='urgent'||p==='emerg'?'urgent':p==='mid'?'mid':'norm')+'">'+PN[p]+'</span>'}
function svcName(k){for(var i=0;i<SERVICES.length;i++)if(SERVICES[i][0]===k)return SERVICES[i][1];return '—'}

/* ---- الهيدر ---- */
var NAV=[['home','الرئيسية'],['services','الخدمات'],['new','طلب جديد'],['orders','طلباتي'],['notifs','الإشعارات'],['invoices','الفواتير'],['support','الدعم'],['profile','حسابي']];
function header(route){
  var h='<div class="bar"><span class="logo">HomeOps</span>';
  if(sess){
    if(sess.role==='customer'){h+='<nav>'+NAV.map(function(n){return '<a class="'+(route===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</a>'}).join('')+'</nav>'}
    else h+='<nav></nav>';
    h+='<span style="font-size:14px">'+esc(sess.name)+' <small style="color:var(--mut)">('+ROLES[sess.role]+')</small></span><button class="link" onclick="logout()">تسجيل الخروج</button>';
  }else h+='<span style="color:var(--mut);font-size:13px">منظومة صيانة المنازل</span>';
  $('#hd').innerHTML=h+'</div>';
}
function logout(){sess=null;save('ho_sess',null);users=[];orders=[];tickets=[];calls=[];aud=[];staffData=[];exps=[];go('login')}

/* ---- تسجيل الدخول ---- */
function vLogin(){
  var cust=roleSel==='customer';
  $('#app').innerHTML='<div class="auth"><div class="card"><h1>تسجيل الدخول</h1><p class="sub">اختار نوع حسابك الأول</p>'+
  '<div class="roles">'+Object.keys(ROLES).map(function(r){return '<button class="'+(r===roleSel?'on':'')+'" onclick="roleSel=\''+r+'\';vLogin()">'+ROLES[r]+'</button>'}).join('')+'</div>'+
  '<label>البريد الإلكتروني</label><input id="em" type="email" dir="ltr" placeholder="name@example.com">'+
  '<label>كلمة المرور</label><input id="pw" type="password" dir="ltr">'+
  '<div class="err" id="er"></div><button class="btn" onclick="doLogin()">دخول</button>'+
  (cust?'<p style="text-align:center;margin:14px 0 0"><button class="link" onclick="go(\'forgot\')">نسيت كلمة المرور؟</button> · <button class="link" onclick="go(\'register\')">إنشاء حساب جديد</button></p>'
  :'<p class="sub" style="margin-top:14px">حسابات '+ROLES[roleSel]+' بيعملها الأدمن بس – مفيش تسجيل جديد.</p>')+
  '</div></div>';
}


/* ---- إنشاء حساب عميل ---- */
function pwRules(p){return[[p.length>=8,'8 حروف على الأقل'],[/[A-Za-z]/.test(p),'حرف واحد على الأقل'],[/\d/.test(p),'رقم واحد على الأقل'],[/[^A-Za-z0-9]/.test(p),'رمز خاص (@#$%)']]}
function rulesHtml(p){return pwRules(p).map(function(r){return '<li class="'+(r[0]?'y':'')+'">'+(r[0]?'✓ ':'○ ')+r[1]+'</li>'}).join('')}
function vRegister(){
  $('#app').innerHTML='<div class="auth"><div class="card"><h1>إنشاء حساب سكني جديد</h1><p class="sub">سجّل بياناتك وابدأ اطلب الصيانة</p>'+
  '<h2>البيانات الشخصية</h2><label>الاسم الكامل</label><input id="rn">'+
  '<label>رقم الموبايل</label><input id="rp" dir="ltr" placeholder="+20 1xx xxx xxxx" inputmode="tel">'+
  '<label>البريد الإلكتروني</label><input id="re" type="email" dir="ltr">'+
  '<h2 style="margin-top:20px">عنوان السكن الأساسي</h2>'+
  '<div class="row"><div><label>المدينة</label><select id="rc"><option>دمياط الجديدة</option><option>دمياط (القديمة)</option></select></div><div><label>الحي</label><input id="rd"></div></div>'+
  '<label>اسم الشارع</label><input id="rs"><div class="row"><div><label>رقم العمارة</label><input id="rb"></div><div><label>الدور / الشقة</label><input id="rf"></div></div>'+
  '<h2 style="margin-top:20px">أمان الحساب</h2><label>كلمة المرور</label><input id="r1" type="password" dir="ltr" oninput="$(\'#rl\').innerHTML=rulesHtml(this.value)">'+
  '<ul class="rules" id="rl">'+rulesHtml('')+'</ul><label>تأكيد كلمة المرور</label><input id="r2" type="password" dir="ltr">'+
  '<label style="font-weight:400;margin-top:16px"><input type="checkbox" id="rt" style="width:auto"> أوافق على الشروط والأحكام وسياسة الخصوصية</label>'+
  '<div class="err" id="er"></div><button class="btn" onclick="doReg()">إنشاء الحساب</button>'+
  '<p style="text-align:center;margin:14px 0 0"><button class="link" onclick="go(\'login\')">عندي حساب – تسجيل الدخول</button></p></div></div>';
}


/* ---- استعادة كلمة المرور + OTP ---- */
var RS={email:''};
function vForgot(){
  $('#app').innerHTML='<div class="auth"><div class="card"><h1>استعادة كلمة المرور</h1><p class="sub">اكتب بريدك المسجل وهنبعتلك رمز تحقق</p>'+
  '<label>البريد الإلكتروني</label><input id="fe" type="email" dir="ltr"><div class="err" id="er"></div>'+
  '<button class="btn" onclick="sendOtp()">إرسال رمز التحقق</button><p style="text-align:center;margin:14px 0 0"><button class="link" onclick="go(\'login\')">العودة لتسجيل الدخول</button></p></div></div>';
}

function vReset(){
  if(!RS.email){go('forgot');return}
  $('#app').innerHTML='<div class="auth"><div class="card"><h1>التحقق وإعادة التعيين</h1><p class="sub">أدخل الرمز المكوّن من 4 أرقام. <b>(مرحلة التجربة: الرمز بيظهر في شاشة السيرفر. الـ SMS/الإيميل هيتربط بعدين)</b></p>'+
  '<div class="otp">'+[0,1,2,3].map(function(i){return '<input maxlength="1" inputmode="numeric" class="od" oninput="if(this.value&&this.nextElementSibling)this.nextElementSibling.focus()">'}).join('')+'</div>'+
  '<label>كلمة المرور الجديدة</label><input id="n1" type="password" dir="ltr" oninput="$(\'#nl\').innerHTML=rulesHtml(this.value)"><ul class="rules" id="nl">'+rulesHtml('')+'</ul>'+
  '<label>تأكيد كلمة المرور</label><input id="n2" type="password" dir="ltr"><div class="err" id="er"></div>'+
  '<button class="btn" onclick="doReset()">تأكيد كلمة المرور وتسجيل الدخول</button></div></div>';
}


/* ---- الرئيسية ---- */
function me(){return users.filter(function(u){return u.email===sess.email})[0]}
function mine(){return orders.filter(function(o){return o.email===sess.email})}
function vHome(){
  var m=mine(),open=m.filter(function(o){return o.status!=='مكتمل'}).length;
  $('#app').innerHTML='<h1>أهلاً '+esc(sess.name)+'</h1><p class="sub">محتاج صيانة؟ اختار الخدمة وابعت طلبك في دقايق.</p>'+
  '<div class="svc">'+SERVICES.map(function(s){return '<div class="card" onclick="W={desc:\'\',place:\'\',syms:[],when:\'\',addr:0,date:\'\',slot:0,step:1};go(\'new\')"><div class="ic">'+s[2]+'</div><h2>'+s[1]+'</h2><div class="sub" style="margin:0">'+s[3]+'</div></div>'}).join('')+'</div>'+
  '<div class="card" style="margin-top:16px"><h2>ملخص حسابك</h2><div class="kv"><span>إجمالي الطلبات</span><b>'+m.length+'</b></div><div class="kv"><span>طلبات جارية</span><b>'+open+'</b></div></div>';
}

/* ---- طلب صيانة جديد (3 خطوات) ---- */
function chips(list,sel,fn,multi){return '<div class="chips">'+list.map(function(x,i){var on=multi?sel.indexOf(x)>-1:sel===x;return '<span class="chip '+(on?'on':'')+'" onclick="'+fn+'('+i+')">'+x+'</span>'}).join('')+'</div>'}
function setPlace(i){W.place=PLACES[i];vNew()}
function setWhen(i){W.when=WHEN[i];vNew()}
function togSym(i){var s=SYMS[i],k=W.syms.indexOf(s);k>-1?W.syms.splice(k,1):W.syms.push(s);vNew()}
function keep(){var d=$('#wd');if(d)W.desc=d.value}
function vNew(){
  keep();var t=triage(),steps=['تفاصيل العطل','العنوان والموعد','المراجعة والتأكيد'];
  var h='<h1>طلب صيانة جديد</h1><p class="sub">الخطوة '+W.step+' من 3</p><div class="steps">'+steps.map(function(s,i){return '<div class="'+(W.step===i+1?'on':'')+'">'+(i+1)+'. '+s+'</div>'}).join('')+'</div><div class="grid"><div class="card">';
  if(W.step===1){
    h+='<label>وصف المشكلة (اختياري)</label><textarea id="wd" oninput="W.desc=this.value;clearTimeout(window._t);window._t=setTimeout(refreshSP,600)" placeholder="مثال: في مية بتنزل من تحت الحوض ومش راضية تقف">'+esc(W.desc)+'</textarea>'+
    '<label>المكان في البيت</label>'+chips(PLACES,W.place,'setPlace')+
    '<label>إيه اللي بيحصل؟ (تقدر تختار أكتر من حاجة)</label>'+chips(SYMS,W.syms,'togSym',true)+
    '<label>بدأت المشكلة إمتى؟</label>'+chips(WHEN,W.when,'setWhen')+vulBox()+attach()+
    '<div class="err" id="er"></div><button class="btn" onclick="nxt(2)">المتابعة للعنوان والموعد</button>';
  }else if(W.step===2){
    var a=me().addrs;
    h+='<label>عنوان الخدمة</label><select id="wa" onchange="W.addr=+this.value">'+a.map(function(x,i){return '<option value="'+i+'" '+(W.addr===i?'selected':'')+'>'+esc(x.city+' – '+x.district+' – '+x.street+(x.bld?' ع '+x.bld:''))+'</option>'}).join('')+'</select>'+
    '<label>تاريخ الزيارة</label><input type="date" id="wdt" value="'+W.date+'" min="'+new Date().toISOString().slice(0,10)+'" onchange="W.date=this.value">'+
    '<label>الفترة</label><div class="chips">'+SLOTS.map(function(s,i){return '<span class="chip '+(W.slot===i?'on':'')+'" onclick="W.slot='+i+';vNew()">'+s+'</span>'}).join('')+'</div>'+
    '<div class="err" id="er"></div><div class="row"><button class="btn sec" onclick="W.step=1;vNew()">رجوع</button><button class="btn" onclick="nxt(3)">المراجعة</button></div>';
  }else{
    var ad=me().addrs[W.addr];
    h+='<h2>راجع طلبك</h2><div class="kv"><span>الخدمة</span><b>'+svcName(t.svc)+'</b></div><div class="kv"><span>المكان</span><b>'+(W.place||'—')+'</b></div><div class="kv"><span>الأعراض</span><b>'+(W.syms.join('، ')||'—')+'</b></div><div class="kv"><span>الوصف</span><b>'+esc(W.desc||'—')+'</b></div><div class="kv"><span>العنوان</span><b>'+esc(ad.city+' – '+ad.district+' – '+ad.street)+'</b></div><div class="kv"><span>الموعد</span><b>'+W.date+' · '+SLOTS[W.slot]+'</b></div><div class="kv"><span>الأولوية المقترحة</span><b>'+(t.pr?pbadge(t.pr):'—')+'</b></div>'+
    '<p class="sub" style="margin-top:12px">الفني بيحدد السعر بعد المعاينة وهيتم إبلاغك قبل أي شغل.</p><div class="row"><button class="btn sec" onclick="W.step=2;vNew()">رجوع</button><button class="btn" onclick="submitOrder()">تأكيد وإرسال الطلب</button></div>';
  }
  h+='</div><div id="sp">'+sidePanel(t)+'</div></div>';$('#app').innerHTML=h}function _dead(t){var h='';h+='<div class="card"><small style="color:var(--mut)">الأولوية المقترحة</small><h2>'+(t.pr?pbadge(t.pr):'في انتظار البيانات')+'</h2>'+
  (t.pr?'':'<p class="sub">اكتب وصفاً أو اختار الأعراض وهيظهر الاقتراح هنا.</p>')+
  '<label>نوع الخدمة</label><div class="kv" style="border:0"><b>'+svcName(t.svc)+'</b></div><p class="sub">دي قواعد مبدئية – هتتبدل بموديل الفرز الذكي لما نربطه.</p></div></div>';
  $('#app').innerHTML=h;
}
function nxt(s){
  keep();var er=$('#er'),t=triage();
  if(s===2&&!t.pr&&!W.place){er.textContent='اكتب وصف أو اختار المكان والأعراض';return}

<div class="card"><h2>الإيراد حسب الخدمة</h2>${Object.keys(by).map(k=>kvh(svcName(k),M(by[k]))+`<div class="bar2"><i style="width:${by[k]/mx*100}%"></i></div>`).join('')||'<p class="sub">مفيش إيرادات لسه.</p>'}</div>
<div class="card"><h2>طرق الدفع</h2>${PAYM.map(m=>kvh(m,P.filter(o=>o.inv.method===m).length+' فاتورة')).join('')}</div>`};
PAGES.finance_inv=()=>{var L=orders.filter(o=>o.inv).reverse(),d=L.filter(o=>o.id===ST.inv)[0]||L[0];
return `<h1>الفواتير والإرسال الإلكتروني (ETA)</h1><p class="sub">الإرسال لمصلحة الضرائب هنا تجريبي (بيولّد رقم تجريبي) لحد ما نربط الـ API الحقيقي.</p><div class="card tbl">${L.length?'<table><tr><th>الفاتورة</th><th>العميل</th><th>الإجمالي</th><th>الدفع</th><th>ETA</th></tr>'+L.map(o=>`<tr><td><a class="link" onclick="ST.inv='${o.id}';vStaff()">INV-${o.id}</a></td><td>${esc(cuName(o.email))}</td><td>${M(o.inv.total)}</td><td>${o.inv.paid?'محصّلة ('+(o.inv.method||'')+')':`<select id="pm_${o.id}" style="width:auto">${PAYM.map(m=>`<option>${m}</option>`).join('')}</select> <button class="btn sm" onclick="payO('${o.id}',$('#pm_${o.id}').value)">تحصيل</button>`}</td><td>${o.inv.eta?'مرسلة (تجريبي)':`<button class="btn sec sm" onclick="etaO('${o.id}')">إرسال</button>`}</td></tr>`).join('')+'</table>':'<p class="sub">مفيش فواتير لسه. بتظهر بعد ما الفني يقفل الطلب.</p>'}</div>
${d?`<div class="card"><h2>تفاصيل INV-${d.id}</h2>${kvh('أجور العمل',M(iLab(d)))}${kvh('قطع الغيار',M(d.inv.parts||0))}${kvh('الإجمالي قبل الضريبة',M(iSub(d)))}${kvh('ضريبة 14%',M(iTax(d)))}${kvh('الإجمالي',M(d.inv.total))}${d.inv.eta?kvh('رقم ETA التجريبي','<span dir="ltr">'+d.inv.eta.uuid+'</span>'):''}</div>`:''}`};
function payRows(){return staffData.filter(s=>s.role==='tech').map(t=>{var O=orders.filter(o=>o.inv&&o.inv.paid&&o.tech===t.email),c=x=>x.reduce((a,o)=>a+iLab(o)*RATE/100,0),lab=O.reduce((a,o)=>a+iLab(o),0),pd=c(O.filter(o=>o.paidOut));return{t:t,n:O.length,lab:lab,c:c(O),paid:pd,due:c(O)-pd}})}

function exportPay(){var r=[['الفني','عدد الأوامر','أجور العمل','العمولة','المصروف','المستحق']];payRows().forEach(x=>r.push([x.t.name,x.n,x.lab,x.c,x.paid,x.due]));
var b=new Blob(['\ufeff'+r.map(x=>x.join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='payroll.csv';a.click()}
PAGES.finance_pay=()=>{var R=payRows();return `<h1>رواتب ومستحقات الفنيين</h1><div class="stats">${stat(R.length,'فنيين')}${stat(M(R.reduce((a,r)=>a+r.due,0)),'مستحقات لم تُصرف')}${stat(M(R.reduce((a,r)=>a+r.paid,0)),'تم صرفه')}</div>
<div class="card"><label>نسبة عمولة الفني من أجور العمل (%) – قيمة مبدئية تعدّلها</label><input type="number" value="${RATE}" onchange="setRate(this.value)"><p class="sub">العمولة بتتحسب على الفواتير المحصّلة بس.</p></div>
<div class="card tbl"><table><tr><th>الفني</th><th>أوامر محصّلة</th><th>أجور العمل</th><th>العمولة</th><th>مصروف</th><th>مستحق</th><th></th></tr>${R.map(r=>`<tr><td>${esc(r.t.name)}</td><td>${r.n}</td><td>${M(r.lab)}</td><td>${M(r.c)}</td><td>${M(r.paid)}</td><td>${M(r.due)}</td><td>${r.due>0?`<button class="btn sm" onclick="payTech('${r.t.email}')">صرف المستحقات</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">مفيش فنيين</td></tr>'}</table></div><button class="btn sec sm" onclick="exportPay()">تصدير CSV</button>`};
function ledger(){var E=[];orders.filter(o=>o.inv).forEach(o=>{var ts=o.inv.ts||0;E.push({ts:ts,d:'إيراد خدمة '+o.id,dr:0,cr:iSub(o),k:'إيراد'});E.push({ts:ts,d:'ضريبة قيمة مضافة '+o.id,dr:0,cr:iTax(o),k:'ضريبة'});
if(o.inv.paid)E.push({ts:o.inv.paidAt||ts,d:'تحصيل '+o.id+' ('+(o.inv.method||'')+')',dr:o.inv.total,cr:0,k:'تحصيل'});
if(o.paidOut)E.push({ts:o.paidOutAt||ts,d:'عمولة '+techName(o.tech)+' – '+o.id,dr:+(iLab(o)*RATE/100).toFixed(2),cr:0,k:'عمولات فنيين'})});
exps.forEach(x=>E.push({ts:x.ts,d:x.d,dr:x.amt,cr:0,k:x.k}));return E.sort((a,b)=>b.ts-a.ts)}

PAGES.finance_led=()=>{var E=ledger(),rev=E.filter(e=>e.k==='إيراد').reduce((a,e)=>a+e.cr,0),vat=E.filter(e=>e.k==='ضريبة').reduce((a,e)=>a+e.cr,0),ex=E.filter(e=>e.k!=='تحصيل').reduce((a,e)=>a+e.dr,0),by={};
E.filter(e=>e.k!=='تحصيل'&&e.dr).forEach(e=>by[e.k]=(by[e.k]||0)+e.dr);
return `<h1>التدقيق المحاسبي وتكاليف التشغيل</h1><p class="sub">سجل حركات مبسّط (مش دفتر أستاذ بقيد مزدوج كامل).</p><div class="stats">${stat(M(rev),'الإيرادات')}${stat(M(vat),'ضريبة مستحقة')}${stat(M(ex),'المصروفات')}${stat(M(rev-ex),'صافي قبل الضريبة')}</div>
<div class="card"><h2>تحليل التكاليف</h2>${Object.keys(by).map(k=>kvh(k,M(by[k]))).join('')||'<p class="sub">مفيش مصروفات.</p>'}</div>
<div class="card"><h2>تسجيل مصروف تشغيل</h2><label>الوصف</label><input id="xd"><div class="row"><div><label>المبلغ (ج.م)</label><input id="xa" type="number"></div><div><label>الفئة</label><select id="xk">${EXPK.map(k=>`<option>${k}</option>`).join('')}</select></div></div><div class="err" id="er"></div><button class="btn" onclick="addExp()">إضافة</button></div>
<div class="card tbl"><h2>سجل الحركات</h2>${E.length?'<table><tr><th>الوقت</th><th>البيان</th><th>الفئة</th><th>مدين</th><th>دائن</th></tr>'+E.map(e=>`<tr><td>${e.ts?new Date(e.ts).toLocaleString('ar-EG'):'—'}</td><td>${esc(e.d)}</td><td>${e.k}</td><td>${e.dr?M(e.dr):''}</td><td>${e.cr?M(e.cr):''}</td></tr>`).join('')+'</table>':'<p class="sub">مفيش حركات.</p>'}</div>`};


/* ================= الاتصال بالسيرفر (FastAPI) ================= */
var API=window.HOMEOPS_API||'';
function toLogin(){if(location.hash==='#login')route();else go('login')}
function api(path,method,body){
  var h={'Content-Type':'application/json'};if(sess&&sess.token)h.Authorization='Bearer '+sess.token;
  return fetch(API+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
    return r.json().catch(function(){return{}}).then(function(j){
      if(!r.ok){
        if(r.status===401&&sess&&path.indexOf('/api/auth/')<0){sess=null;save('ho_sess',null);toLogin()}
        throw new Error(typeof j.detail==='string'?j.detail:'حصل خطأ، جرّب تاني')}
      return j})},function(){throw new Error('مفيش اتصال بالسيرفر، اتأكد إنه شغال')})}
function refresh(){return api('/api/state').then(function(s){
  users=s.users||[];orders=s.orders||[];tickets=s.tickets||[];calls=s.calls||[];aud=s.audit||[];staffData=s.staff||[];exps=s.expenses||[];
  RATE=s.rate;ENABLED=s.enabled;syncSvc()})}
function startSess(r){sess={role:r.user.role,name:r.user.name,email:r.user.email,token:r.token};save('ho_sess',sess)}
function dropSess(){sess=null;save('ho_sess',null)}
function act(path,body){return api(path,'POST',body||{}).then(refresh).then(function(){vStaff()}).catch(function(e){alert(e.message)})}

function doLogin(){
  var em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,er=$('#er');
  if(!em||!pw){er.textContent='اكتب البريد وكلمة المرور';return}
  er.textContent='';
  api('/api/auth/login','POST',{role:roleSel,email:em,password:pw}).then(function(r){startSess(r);return refresh()})
  .then(function(){go(roleSel==='customer'?'home':'staff')}).catch(function(e){dropSess();er.textContent=e.message});
}
function doReg(){
  var g=function(i){return $('#'+i).value.trim()},er=$('#er'),p=$('#r1').value;
  if(!g('rn')||!g('rp')||!g('re')||!g('rs')||!g('rd')){er.textContent='كمّل كل البيانات المطلوبة';return}
  if(!/^\S+@\S+\.\S+$/.test(g('re'))){er.textContent='البريد الإلكتروني مش صحيح';return}
  if(!/^(\+?20|0)?1[0125]\d{8}$/.test(g('rp').replace(/\s/g,''))){er.textContent='رقم الموبايل مش صحيح';return}
  if(pwRules(p).some(function(r){return !r[0]})){er.textContent='كلمة المرور لا تحقق الشروط';return}
  if(p!==$('#r2').value){er.textContent='كلمتا المرور مش متطابقتين';return}
  if(!$('#rt').checked){er.textContent='لازم توافق على الشروط';return}
  api('/api/auth/register','POST',{name:g('rn'),phone:g('rp'),email:g('re').toLowerCase(),password:p,lang:'ar',addr:{city:$('#rc').value,district:g('rd'),street:g('rs'),bld:g('rb'),floor:g('rf')}})
  .then(function(r){startSess(r);return refresh()}).then(function(){go('home')}).catch(function(e){dropSess();er.textContent=e.message});
}
function sendOtp(){
  var e=$('#fe').value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(e)){$('#er').textContent='اكتب بريد صحيح';return}
  api('/api/auth/forgot','POST',{email:e}).then(function(){RS.email=e;go('reset')}).catch(function(x){$('#er').textContent=x.message});
}
function doReset(){
  var code=Array.prototype.map.call(document.querySelectorAll('.od'),function(i){return i.value}).join(''),p=$('#n1').value,er=$('#er');
  if(code.length<4){er.textContent='اكتب رمز التحقق (4 أرقام)';return}
  if(pwRules(p).some(function(r){return !r[0]})){er.textContent='كلمة المرور لا تحقق الشروط';return}
  if(p!==$('#n2').value){er.textContent='كلمتا المرور مش متطابقتين';return}
  api('/api/auth/reset','POST',{email:RS.email,code:code,password:p}).then(function(r){RS.email='';startSess(r);return refresh()})
  .then(function(){go('home')}).catch(function(e){dropSess();er.textContent=e.message});
}
function saveProf(){var er=$('#er');er.className='err';
  api('/api/me','PUT',{name:$('#pn').value.trim(),phone:$('#pp').value.trim(),lang:$('#pl').value}).then(function(u){sess.name=u.name;save('ho_sess',sess);return refresh()})
  .then(function(){header('profile');er=$('#er');er.className='err ok';er.textContent='تم الحفظ ✓'}).catch(function(e){er.textContent=e.message})}
function submitOrder(){var q=triage();
  if(!q.svc){alert('اختار نوع الخدمة الأول');return}
  if(!ENABLED[q.svc]){alert('الخدمة دي لسه مش متاحة وهتتوفر قريباً. لو في خطر اخرج من المكان واطلب أرقام الطوارئ الرسمية.');return}
  api('/api/orders','POST',{svc:q.svc,pr:q.pr||'mid',place:W.place||'',syms:W.syms,symc:payload().symptoms,desc:W.desc||'',date:W.date,slot:SLOTS[W.slot],addr:W.addr,files:(W.files||[]).length,vulnerable:!!W.vul})
  .then(refresh).then(function(){W={desc:'',place:'',syms:[],when:'',addr:0,date:'',slot:0,step:1};go('orders')}).catch(function(e){alert(e.message)});
}
function sendTk(){var x=$('#tx').value.trim();if(!x){$('#er').textContent='اكتب التفاصيل';return}
  api('/api/tickets/support','POST',{type:$('#tt').value,text:x}).then(refresh).then(vSupport).catch(function(e){$('#er').textContent=e.message})}
function closeOrder(){var o=openO()[0];if(!o){alert('مفيش طلب مفتوح');return}
  api('/api/orders/'+o.id+'/close','POST',{lab:+$('#lab').value||0,parts:partsT()}).then(refresh).then(function(){ST.parts=[];ST.stg=1;stab('tasks')}).catch(function(e){alert(e.message)})}
function assignO(id){var e=$('#as_'+id).value;act('/api/orders/'+id+'/assign',{tech:e})}
function orderCall(id,res){act('/api/orders/'+id+'/call',{result:res})}
function saveCall(){if(!(CC.x||'').trim()){$('#er').textContent='اكتب تفاصيل البلاغ';return}
  api('/api/tickets','POST',{type:CC.cls,pr:CC.pr,text:CC.x,ord:CC.ord||'',actions:CC.act.slice(),cust:CC.cust||'',sender:CC.n||''})
  .then(function(r){ST.tk=r.id;CC={cls:'بلاغ عطل جديد',pr:'عاجل',act:['إخطار الفني فوراً','إرسال SMS للعميل']};return refresh()})
  .then(function(){stab('tk')}).catch(function(e){$('#er').textContent=e.message})}
function tkDone(id){act('/api/tickets/'+id+'/done')}
function techCall(id,res){act('/api/tickets/'+id+'/techcall',{result:res})}
function addNote(id){var v=$('#nt').value.trim();if(!v)return;act('/api/tickets/'+id+'/note',{text:v})}
function escal(id){act('/api/tickets/'+id+'/escalate')}
function payO(id,m){act('/api/invoices/'+id+'/pay',{method:m||PAYM[0]})}
function etaO(id){act('/api/invoices/'+id+'/eta')}
function payTech(e){act('/api/payroll/pay',{email:e})}
function setRate(v){api('/api/settings/rate','PUT',{rate:+v||0}).then(refresh).then(function(){vStaff()}).catch(function(e){alert(e.message);vStaff()})}
function addExp(){var d=$('#xd').value.trim(),a=+$('#xa').value,k=$('#xk').value;if(!d||!(a>0)){$('#er').textContent='اكتب الوصف ومبلغ صحيح';return}
  api('/api/expenses','POST',{descr:d,amt:a,kind:k}).then(refresh).then(function(){vStaff()}).catch(function(e){$('#er').textContent=e.message})}
function togSvc(k){act('/api/admin/services/'+k+'/toggle')}
function togStaff(id){act('/api/admin/staff/'+id+'/toggle')}
function addStaff(){var n=$('#an').value.trim(),e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value,er=$('#er');
  if(!n||!/^\S+@\S+\.\S+$/.test(e)){er.textContent='كمّل الاسم والبريد';return}
  if(pwRules(p).some(function(r){return !r[0]})){er.textContent='كلمة المرور لازم 8 حروف على الأقل وفيها حرف ورقم ورمز';return}
  api('/api/admin/staff','POST',{role:$('#ar').value,name:n,email:e,password:p}).then(refresh).then(function(){vStaff()}).catch(function(x){er.textContent=x.message})}

/* ---- الراوتر ---- */
var PUB=['login','register','forgot','reset'];
var VIEWS={services:vServices,invoices:vInvoices,support:vSupport,login:vLogin,register:vRegister,forgot:vForgot,reset:vReset,home:vHome,new:vNew,orders:vOrders,notifs:vNotifs,profile:vProfile,staff:vStaff};
function route(){
  var r=location.hash.slice(1)||(sess?(sess.role==='customer'?'home':'staff'):'login');
  if(!VIEWS[r])r='login';
  if(!sess&&PUB.indexOf(r)<0)r='login';
  if(sess&&PUB.indexOf(r)>-1)r=sess.role==='customer'?'home':'staff';
  if(sess&&sess.role!=='customer'&&r!=='staff')r='staff';
  if(r==='new'&&!me()){logout();return}
  $('#app').style.maxWidth=r==='staff'?'1240px':'';header(r);VIEWS[r]();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
if(sess&&sess.token){refresh().then(route,function(e){if(sess){header('');$('#app').innerHTML='<div class="auth"><div class="card"><h2>تعذر الاتصال بالسيرفر</h2><p class="sub">'+esc(e.message)+'</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div></div>'}else route()})}
else{if(sess)dropSess();route()}
</script>
